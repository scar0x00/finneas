# Git hooks (installed by `pnpm install` through the root `prepare` script).
# Skip once with `LEFTHOOK=0 git commit ...`.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm -r typecheck
